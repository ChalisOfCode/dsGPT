name: Focused production account Docker checks
on:
  push:
    branches: [work/android-account-read-4b87ed1]
    paths: [.github/workflows/account-docker-check.yml, tests/test_account_docker_browser.py]
permissions:
  contents: read
concurrency:
  group: account-docker-check
  cancel-in-progress: false
jobs:
  account-docker:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Install locked test dependencies without shared caches
        run: python -m pip install --no-cache-dir -r requirements-dev.lock
      - name: Build the exact production recipe on the disposable runner
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/account-docker-context"
          python scripts/prepare_app_toolchain.py --directory "$context"
          recipe="$(python -c 'from dsgpt.tool_setup import recipe_digest; print(recipe_digest())')"
          base="$(python -c 'from dsgpt.tool_setup import BASE_IMAGE; print(BASE_IMAGE)')"
          docker build --no-cache --build-arg "DSGPT_BASE_IMAGE=$base" \
            --label "org.dsgpt.recipe=$recipe" --tag dsgpt-account-check:ci "$context"
          docker image inspect --format '{{.Id}}' dsgpt-account-check:ci > "$RUNNER_TEMP/account-image-id"
          printf 'Production recipe SHA256: %s\n' "$recipe"
      - name: Check actual Docker guest and broker boundaries
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          export DSGPT_ACCOUNT_DOCKER_IMAGE="$(cat "$RUNNER_TEMP/account-image-id")"
          python -m pytest -p no:cacheprovider -q --tb=short tests/test_account_docker_browser.py \
            --junitxml="$RUNNER_TEMP/account-docker.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          suites = ElementTree.parse(Path(os.environ['RUNNER_TEMP']) / 'account-docker.xml').getroot()
          totals = {k: sum(int(s.get(k, 0)) for s in suites.iter('testsuite'))
                    for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Production Docker account checks:', totals)
          assert totals == dict(tests=2, failures=0, errors=0, skipped=0)
          PY
      - name: Remove only this job's disposable image
        if: always()
        run: docker image rm --force dsgpt-account-check:ci || true
