name: Focused Android account checks
on:
  push:
    branches: [work/android-account-read-4b87ed1]
    paths: [.github/workflows/account-android-check.yml, 'clients/android/**']
permissions:
  contents: read
concurrency:
  group: account-android-check
  cancel-in-progress: false
jobs:
  android-account:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Compile and test Android account reads
        working-directory: clients/android
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_USER_HOME="$(mktemp -d "$RUNNER_TEMP/dsgpt-gradle.XXXXXX")"
          trap 'rm -rf -- "$GRADLE_USER_HOME"' EXIT
          bash gradlew --no-daemon --no-build-cache --no-configuration-cache \
            --console=plain testDebugUnitTest \
            --tests com.dsgpt.mobile.AccountReadTransportTest \
            --tests com.dsgpt.mobile.AccountReadViewTest \
            --tests com.dsgpt.mobile.AccountReadsTest
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          tests = errors = failures = skipped = 0
          for path in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              row = ElementTree.parse(path).getroot()
              tests += int(row.attrib["tests"])
              errors += int(row.attrib["errors"])
              failures += int(row.attrib["failures"])
              skipped += int(row.attrib["skipped"])
          print(f"Account tests: {tests}; failures: {failures}; errors: {errors}; skipped: {skipped}")
          assert tests >= 10 and not (errors or failures or skipped)
          PY
