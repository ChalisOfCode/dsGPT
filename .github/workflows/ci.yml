name: Public build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DSGPT_ZERO_COST_READY: ${{ vars.DSGPT_ZERO_COST_READY }}
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  source-audit:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Scan the tracked snapshot with a verified free scanner
        run: python scripts/scan_public_source.py

  backend:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Install locked dependencies and check source
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils tesseract-ocr tesseract-ocr-eng python3-pil
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          ruff check src tests scripts
          python scripts/check_ci_policy.py
      - name: Backend regression tests
        run: pytest -v -o faulthandler_timeout=120 --junitxml=reports/backend.xml
      - name: Build backend wheel once
        run: |
          python -m build --wheel --no-isolation
          mkdir -p artifacts/backend
          cp dist/*.whl artifacts/backend/
          python scripts/ci_provenance.py write artifacts/backend "$GITHUB_SHA"
      - name: Check shared output storage
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py artifacts/backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-${{ github.sha }}
          path: artifacts/backend/
          retention-days: 1
          if-no-files-found: error
      - name: Check diagnostic storage
        id: diagnostics
        if: always() && hashFiles('reports/backend.xml') != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py reports/backend.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.diagnostics.outcome == 'success' && !cancelled()
        with:
          name: backend-tests-${{ github.sha }}
          path: reports/backend.xml
          retention-days: 1

  frontend:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Test and build the web bundle once
        working-directory: clients/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          python ../../scripts/ci_provenance.py write dist "$GITHUB_SHA"
      - name: Check shared output storage
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py clients/desktop/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-${{ github.sha }}
          path: clients/desktop/dist/
          retention-days: 1
          if-no-files-found: error

  browser:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Install fixture backend and browser
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          cd clients/desktop
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise actual browser UI against isolated test data
        working-directory: clients/desktop
        run: |
          export DSGPT_TEST_PYTHON="$(command -v python)"
          export DSGPT_E2E_REPORT="$GITHUB_WORKSPACE/reports/browser.json"
          npm run test:e2e
      - name: Verify real Chromium profile restart with synthetic state
        run: |
          export DSGPT_PROFILE_TEST_CHROMIUM="$(cd clients/desktop && node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$DSGPT_PROFILE_TEST_CHROMIUM"
          python -m pytest -q tests/test_account_browser_worker.py
      - name: Check diagnostic storage
        id: diagnostics
        if: always() && hashFiles('reports/browser.json') != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py reports/browser.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.diagnostics.outcome == 'success' && !cancelled()
        with:
          name: browser-tests-${{ github.sha }}
          path: reports/browser.json
          retention-days: 1

  android:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build unsigned production input and separate test APKs once
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p artifacts/android
          cd clients/android
          bash gradlew --no-daemon testDebugUnitTest assembleRelease
          # Routine consumers use only the two acceptance APKs. Keep evidence of
          # the separate production build without retaining an unused binary.
          release_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$release_apk"
          sha256sum "$release_apk" > ../../artifacts/android/production-unsigned.sha256
          stat -c '%s' "$release_apk" > ../../artifacts/android/production-unsigned.bytes
          bash gradlew --no-daemon -Pacceptance assembleDebug assembleDebugAndroidTest
          cp app/build/outputs/apk/debug/app-debug.apk ../../artifacts/android/acceptance.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../../artifacts/android/acceptance-test.apk
          cd ../..
          python scripts/ci_provenance.py write artifacts/android "$GITHUB_SHA"
      - name: Check shared output storage
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py artifacts/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-${{ github.sha }}
          path: artifacts/android/
          retention-days: 1
          if-no-files-found: error
      - name: Check diagnostic storage
        id: diagnostics
        if: always() && hashFiles('clients/android/app/build/test-results/**/*.xml') != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py clients/android/app/build/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.diagnostics.outcome == 'success' && !cancelled()
        with:
          name: android-tests-${{ github.sha }}
          path: clients/android/app/build/test-results/
          retention-days: 1

  android-runtime:
    needs: android
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-${{ github.sha }}
          path: shared/android
      - name: Verify shared APKs and prepare the emulator
        run: |
          python scripts/ci_provenance.py verify shared/android "$GITHUB_SHA"
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          bash scripts/ci_android_emulator.sh
      - name: Run acceptance and lifecycle instrumentation on the exact APKs
        run: |
          mkdir -p clients/android/app/build/outputs/apk/{debug,androidTest/debug}
          cp shared/android/acceptance.apk clients/android/app/build/outputs/apk/debug/app-debug.apk
          cp shared/android/acceptance-test.apk clients/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          python scripts/check_acceptance_ci.py --root "$RUNNER_TEMP/acceptance-phone" --phone
          # The harness removes its owned test app; reinstall clean fixture data.
          adb install -t shared/android/acceptance.apk
          adb install -t shared/android/acceptance-test.apk
          adb shell am instrument -w -r -e class com.dsgpt.mobile.DiagnosticsInstrumentedTest com.dsgpt.mobile.acceptance.test/androidx.test.runner.AndroidJUnitRunner > reports/android-instrumentation.txt
          python scripts/check_android_instrumentation.py reports/android-instrumentation.txt
      - name: Stop emulator and retain bounded fixture diagnostics
        if: always()
        run: |
          mkdir -p reports
          adb logcat -d -s AndroidRuntime > reports/android-runtime.log || true
          adb emu kill || true
      - name: Check diagnostic storage
        id: diagnostics
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.diagnostics.outcome == 'success' && !cancelled()
        with:
          name: android-runtime-${{ github.sha }}
          path: reports/
          retention-days: 1

  windows-native:
    needs: frontend
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: 'frontend-${{ github.sha }}', path: shared/frontend}
      - name: Compile native Windows client using the shared web bundle
        shell: pwsh
        run: scripts/ci_windows.ps1 -BuildOnly
      - name: Check shared output storage
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py dist/windows-client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-client-${{ github.sha }}
          path: dist/windows-client/
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: [backend, windows-native, android]
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: 'backend-${{ github.sha }}', path: shared/backend}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: 'windows-client-${{ github.sha }}', path: shared/windows-client}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: 'android-${{ github.sha }}', path: shared/android}
      - name: Build native client and test installer on disposable Windows
        shell: pwsh
        run: scripts/ci_windows.ps1
      - name: Check shared output storage
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py artifacts/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-${{ github.sha }}
          path: artifacts/windows/
          retention-days: 1
          if-no-files-found: error
      - name: Check diagnostic storage
        id: diagnostics
        if: always() && hashFiles('reports/windows/*.json') != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py reports/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.diagnostics.outcome == 'success' && !cancelled()
        with:
          name: windows-tests-${{ github.sha }}
          path: reports/windows/
          retention-days: 1

  required:
    needs: [source-audit, backend, frontend, browser, android, android-runtime, windows-native, windows]
    if: always() && github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every software build/test result
        env: {RESULTS: '${{ toJSON(needs) }}'}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, result in results.items() if result['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          print('All routine software checks passed. Physical hardware and outstanding release scope remain separate.')
          PY
