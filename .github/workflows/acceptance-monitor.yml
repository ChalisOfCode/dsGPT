name: Ten-minute acceptance monitor
on:
  push:
    branches: [monitor/acceptance-43278654806]
    paths: [.github/workflows/acceptance-monitor.yml]
permissions:
  actions: read
concurrency:
  group: monitor-acceptance-43278654806
  cancel-in-progress: false
jobs:
  monitor:
    name: Check acceptance run 43278654806 every ten minutes
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Record live status until the acceptance run finishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repo = "ChalisOfCode/dsGPT"
          run_id = 43278654806
          expected_head = "b83c47fc1bc79af0c47c4d8e20110a7a193304bc"
          if os.environ["GITHUB_REPOSITORY"] != repo:
              raise SystemExit("Refusing to monitor a different repository")
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "dsGPT-acceptance-monitor",
          })

          def record(message):
              line = f"{datetime.now(timezone.utc).isoformat(timespec='seconds')} — {message}"
              print(line, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"- {line}\n")

          start = time.monotonic()
          for check in range(3):
              while (remaining := start + 600 * check - time.monotonic()) > 0:
                  time.sleep(min(remaining, 30))
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      run = json.load(response)
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                  record(f"Status temporarily unavailable ({type(exc).__name__})")
                  continue
              if run.get("id") != run_id or run.get("head_sha") != expected_head:
                  raise SystemExit("Acceptance run identity did not match")
              status, conclusion = run["status"], run.get("conclusion")
              record(f"Acceptance: {status}" + (f" ({conclusion})" if conclusion else ""))
              if status == "completed":
                  raise SystemExit(0 if conclusion == "success" else 1)
          raise SystemExit("Monitor reached its time limit without observing completion")
          PY
