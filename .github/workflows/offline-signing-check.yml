name: Independent offline APK signing format check
on:
  push:
    branches: [work/upgrade-diagnostics-5638a5d]
    paths: [.github/workflows/offline-signing-check.yml, scripts/sign_apk_v2.py, tests/test_apk_offline_signing.py]
permissions:
  contents: read
  actions: read
concurrency:
  group: offline-signing-check
  cancel-in-progress: false
jobs:
  sdk-verification:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Install disposable verification dependencies without shared caches
        run: python -m pip install --no-cache-dir -r requirements-dev.lock cryptography==50.0.0
      - name: Independently verify synthetic signature and reject content tampering
        run: |
          set -euo pipefail
          export DSGPT_APKSIGNER_JAR="$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          test -f "$DSGPT_APKSIGNER_JAR"
          python -m pytest -p no:cacheprovider -q --tb=short tests/test_apk_offline_signing.py --junitxml=reports/offline-signing.xml
          python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('reports/offline-signing.xml').getroot()
          totals = {k: sum(int(s.get(k, 0)) for s in root.iter('testsuite'))
                    for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Synthetic signing format checks:', totals)
          assert totals['tests'] == 7 and all(totals[k] == 0 for k in ('failures', 'errors', 'skipped'))
          PY
      - name: Bound synthetic report storage
        id: report
        if: always() && hashFiles('reports/offline-signing.xml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DSGPT_ZERO_COST_READY: ${{ vars.DSGPT_ZERO_COST_READY }}
        run: python scripts/ci_artifact_guard.py reports/offline-signing.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.report.outcome == 'success' && !cancelled()
        with:
          name: offline-signing-${{ github.sha }}
          path: reports/offline-signing.xml
          retention-days: 1
          if-no-files-found: error
