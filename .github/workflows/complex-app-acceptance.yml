name: Bounded APK and EXE smoke acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/complex-acceptance-request.txt]
permissions:
  contents: read
  actions: read
env:
  DSGPT_ZERO_COST_READY: ${{ vars.DSGPT_ZERO_COST_READY }}

defaults:
  run:
    shell: bash

concurrency:
  group: complex-app-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model:
    name: Two bounded 9B edits and independent Docker builds
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the pinned backend and record runner resources
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          python -m pip freeze > evidence/python-packages.txt
          free -b > evidence/runner-memory.txt
          df -B1 > evidence/runner-disk.txt
          lscpu > evidence/runner-cpu.txt
          docker version > evidence/docker-version.txt
      - name: Prepare the pinned CPU Ollama runtime and exact 9B model
        timeout-minutes: 30
        run: |
          python scripts/prepare_complex_model_ci.py --directory "$RUNNER_TEMP/complex-model-runtime" --output evidence/model-runtime.json --port 11435 --threads 4
      - name: Build the exact production Docker toolchain
        env:
          DSGPT_BASE_IMAGE: python@sha256:2ed6491b93cd49272ee6de2b5a38440c3448360322c089fc23e370722d74179d
        run: |
          python scripts/prepare_app_toolchain.py --directory "$RUNNER_TEMP/complex-tool-context"
          DSGPT_RECIPE="$(python -c 'from dsgpt.tool_setup import recipe_digest; print(recipe_digest())')"
          docker build --pull --build-arg "DSGPT_BASE_IMAGE=$DSGPT_BASE_IMAGE" --label "org.dsgpt.recipe=$DSGPT_RECIPE" --tag dsgpt-complex-toolchain:ci --file "$RUNNER_TEMP/complex-tool-context/Dockerfile" "$RUNNER_TEMP/complex-tool-context" 2>&1 | tee evidence/toolchain-build.log
          docker image inspect dsgpt-complex-toolchain:ci > evidence/toolchain-image.json
          docker image inspect --format '{{.Id}}' dsgpt-complex-toolchain:ci > evidence/toolchain-image-id.txt
      - name: Run two real model edits within six inference minutes
        timeout-minutes: 16
        run: |
          DSGPT_IMAGE_ID="$(cat evidence/toolchain-image-id.txt)"
          python -I scripts/live_app_smoke.py \
            --image "$DSGPT_IMAGE_ID" --state "$RUNNER_TEMP/bounded-app-state" \
            --output evidence/complex-model.json --artifacts evidence/model-apps \
            2>&1 | tee evidence/complex-model.log
      - name: Collect final runner and owned runtime evidence
        if: always()
        run: |
          mkdir -p evidence
          docker ps --all --filter label=org.dsgpt.owner --no-trunc > evidence/remaining-containers.txt
          if [ -f "$RUNNER_TEMP/complex-model-runtime/ollama.log" ]; then cp "$RUNNER_TEMP/complex-model-runtime/ollama.log" evidence/ollama.log; fi
          free -b > evidence/runner-memory-final.txt
          df -B1 > evidence/runner-disk-final.txt
      - name: Check retained evidence storage
        id: storage_1
        if: always() && !cancelled()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py evidence/
      - name: Retain actual model evidence and produced binaries
        if: always() && steps.storage_1.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complex-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Exact generated EXEs on disposable Windows
    needs: model
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: complex-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Launch both EXE revisions and verify their window titles
        timeout-minutes: 15
        run: |
          python scripts/check_app_smoke.py --platform windows --initial evidence/model-apps/initial/artifacts/dist/app.exe --updated evidence/model-apps/followup/artifacts/dist/app.exe --output native/windows-native.json
      - name: Check retained evidence storage
        id: storage_2
        if: always() && !cancelled()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py native/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.storage_2.outcome == 'success' && !cancelled()
        with:
          name: complex-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/
          if-no-files-found: error
          retention-days: 1

  android:
    name: Exact generated APKs on disposable Android emulator
    needs: model
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: complex-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Prepare an explicit Android 35 virtual device
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/complex-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p native "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name complex-ledger --device pixel_6 --path "$ANDROID_AVD_HOME/complex-ledger.avd" --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd complex-ledger -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -camera-back none -camera-front none > native/emulator.log 2>&1 &
          emulator_pid=$!
          ready=0
          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat native/emulator.log; exit 1; fi
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
      - name: Install both APK revisions and verify their visible headings
        run: |
          DSGPT_GENERATED_PACKAGE="$(python -c 'import json,pathlib; task=json.loads(pathlib.Path("evidence/complex-model.json").read_text())["task_id"]; print("com.dsgpt.generated.p"+task.replace("-",""))')"
          python scripts/check_app_smoke.py --platform android --serial emulator-5554 --package "$DSGPT_GENERATED_PACKAGE" --initial evidence/model-apps/initial/artifacts/dist/app.apk --updated evidence/model-apps/followup/artifacts/dist/app.apk --output native/android-native.json
      - name: Collect emulator diagnostics and stop the virtual device
        if: always()
        run: |
          mkdir -p native
          adb -s emulator-5554 logcat -d -s AndroidRuntime > native/android-runtime.log || true
          adb -s emulator-5554 emu kill || true
      - name: Check retained evidence storage
        id: storage_3
        if: always() && !cancelled()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py native/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.storage_3.outcome == 'success' && !cancelled()
        with:
          name: complex-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/
          if-no-files-found: error
          retention-days: 1

  acceptance:
    name: Join actual model and exact-binary native evidence
    needs: [model, windows, android]
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: complex-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: complex-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: complex-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: native
      - name: Match both native smoke reports to exact model-edited binaries
        run: |
          python scripts/check_app_smoke.py --platform join --model evidence/complex-model.json --android native/android-native.json --windows native/windows-native.json --output joined/complex-acceptance.json
      - name: Check retained evidence storage
        id: storage_4
        if: always() && !cancelled()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py joined/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.storage_4.outcome == 'success' && !cancelled()
        with:
          name: complex-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: joined/
          if-no-files-found: error
          retention-days: 1
