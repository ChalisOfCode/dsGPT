name: Bounded account TLS integration
on:
  push:
    branches: [work/account-tls-check]
permissions:
  contents: read
  actions: read
concurrency:
  group: account-tls-check
  cancel-in-progress: false
env:
  DSGPT_ZERO_COST_READY: ${{ vars.DSGPT_ZERO_COST_READY }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: src
  PIP_NO_CACHE_DIR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  browser-tls:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Use existing runner browser and locked dependencies
        run: |
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
          python -m pip install --no-cache-dir -r requirements-dev.lock
      - name: Run focused real TLS and browser driver checks
        env:
          DSGPT_PROFILE_TEST_CHROMIUM: /opt/google/chrome/chrome
        run: |
          python -m pytest -p no:cacheprovider -q tests/test_account_https_site.py tests/test_account_https_broker.py tests/test_account_https_browser.py --junitxml=reports/account-tls.xml
      - name: Check bounded report storage
        id: report
        if: always() && hashFiles('reports/account-tls.xml') != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py reports/account-tls.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.report.outcome == 'success' && !cancelled()
        with:
          name: account-tls-${{ github.sha }}
          path: reports/account-tls.xml
          retention-days: 1
