name: Exact production Windows upgrade
on:
  push:
    branches: [work/windows-upgrade-9483]
    paths: [.github/workflows/windows-upgrade-check.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-windows-upgrade
  cancel-in-progress: false
env:
  DSGPT_ZERO_COST_READY: ${{ vars.DSGPT_ZERO_COST_READY }}
  PIP_NO_CACHE_DIR: '1'
  PYTHONUTF8: '1'
jobs:
  audit:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Scan public source and CI policy
        run: |
          python scripts/scan_public_source.py
          python scripts/check_ci_policy.py
  upgrade:
    needs: audit
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Reuse the exact retained installer without rebuilding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '14024037157'
          run-id: '43396872188'
          github-token: ${{ github.token }}
          path: retained-candidate
          merge-multiple: true
      - name: Verify retained source and installer bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --no-cache-dir cryptography==50.0.0
          python scripts/ci_provenance.py verify retained-candidate 6ae57f4d818a636fbb37a8a2e76fc7a5c819eacd
          $digest = (Get-FileHash retained-candidate/dsGPT-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'a6f20d1b517120b962b1c023bed47eab523d72dbc09cbc1d432941d35ad18331') { throw 'Retained installer hash changed' }
      - name: Prepare bounded confidential Windows receiver
        run: python scripts/upgrade_windows_transfer.py prepare --directory "$env:RUNNER_TEMP/windows-private" --challenge public-challenge/challenge.json --run "$env:GITHUB_RUN_ID" --source "$env:GITHUB_SHA"
      - name: Bound challenge storage
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py public-challenge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-receiver-${{ github.run_id }}
          path: public-challenge/challenge.json
          retention-days: 1
          if-no-files-found: error
      - name: Receive exact old EXE and already verified APK
        run: python scripts/upgrade_windows_transfer.py receive --directory "$env:RUNNER_TEMP/windows-private" --challenge public-challenge/challenge.json --run "$env:GITHUB_RUN_ID" --source "$env:GITHUB_SHA"
      - name: Diagnose the unchanged old-to-new installed boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/check_application_upgrade.py --baseline "$env:RUNNER_TEMP/windows-private/baseline-setup.exe" --candidate retained-candidate/dsGPT-Setup.exe --candidate-sha256 a6f20d1b517120b962b1c023bed47eab523d72dbc09cbc1d432941d35ad18331 --source 6ae57f4d818a636fbb37a8a2e76fc7a5c819eacd --install-dir "$env:RUNNER_TEMP/dsGPT Upgraded App" --private "$env:RUNNER_TEMP/windows-upgrade-observations" --report reports/windows-upgrade/upgrade.json
      - name: Bound acceptance receipt
        id: receipt_storage
        if: always() && hashFiles('reports/windows-upgrade/*.json') != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/ci_artifact_guard.py reports/windows-upgrade
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.receipt_storage.outcome == 'success' && !cancelled()
        with:
          name: windows-upgrade-reports-${{ github.sha }}
          path: reports/windows-upgrade/
          retention-days: 1
          if-no-files-found: error
      - name: Destroy confidential receiver and private observations
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/windows-private", "$env:RUNNER_TEMP/windows-upgrade-observations" -ErrorAction SilentlyContinue
