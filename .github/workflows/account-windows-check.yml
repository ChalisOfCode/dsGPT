name: Focused native Windows account protection
on:
  push:
    branches: [work/android-account-read-4b87ed1]
    paths: [.github/workflows/account-windows-check.yml, tests/test_account_windows_boundary.py]
permissions:
  contents: read
concurrency:
  group: account-windows-check
  cancel-in-progress: false
jobs:
  windows-account:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: windows-2025
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Install locked dependencies without shared caches
        run: python -m pip install --no-cache-dir -r requirements-dev.lock
      - name: Verify native DPAPI profile and grant continuity
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider -q --tb=short tests/test_account_windows_boundary.py \
            --junitxml="$RUNNER_TEMP/account-windows.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          suites = ElementTree.parse(Path(os.environ['RUNNER_TEMP']) / 'account-windows.xml').getroot()
          totals = {k: sum(int(s.get(k, 0)) for s in suites.iter('testsuite'))
                    for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Windows account protection checks:', totals)
          assert totals == dict(tests=1, failures=0, errors=0, skipped=0)
          PY
