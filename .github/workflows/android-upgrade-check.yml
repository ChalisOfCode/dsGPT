name: Exact production Android in-place upgrade
on:
  push:
    branches: [work/upgrade-diagnostics-5638a5d]
    paths: [.github/workflows/android-upgrade-check.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: android-production-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.repository.private == false && vars.DSGPT_ZERO_COST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Scan source and install temporary runner dependencies
        run: |
          python scripts/scan_public_source.py
          python -m pip install --no-cache-dir -r requirements-dev.lock cryptography==50.0.0
      - name: Prepare one-run confidential APK receiver
        run: python scripts/upgrade_binary_transfer.py prepare --directory "$RUNNER_TEMP/apk-private" --challenge public-challenge/challenge.json --run "$GITHUB_RUN_ID" --source "$GITHUB_SHA"
      - name: Bound public challenge
        env:
          GH_TOKEN: ${{ github.token }}
          DSGPT_ZERO_COST_READY: ${{ vars.DSGPT_ZERO_COST_READY }}
        run: python scripts/ci_artifact_guard.py public-challenge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: receiver-${{ github.run_id }}
          path: public-challenge/challenge.json
          retention-days: 1
          if-no-files-found: error
      - name: Receive the already verified exact APK pair
        run: python scripts/upgrade_binary_transfer.py receive --directory "$RUNNER_TEMP/apk-private" --challenge public-challenge/challenge.json --run "$GITHUB_RUN_ID" --source "$GITHUB_SHA"
      - name: Prepare disposable API-28 emulator
        run: bash scripts/ci_android_upgrade_emulator.sh
      - name: Check real installed production update and reconnect
        run: timeout 360 python scripts/check_android_upgrade.py --private "$RUNNER_TEMP/apk-private" --report reports/android-upgrade.json
      - name: Destroy receiver, temporary trust, emulator data and private observations
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
          rm -rf -- "$RUNNER_TEMP/apk-private" "$RUNNER_TEMP/upgrade-android" "$RUNNER_TEMP/upgrade-emulator.log"
      - name: Bound fixed acceptance receipt
        id: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DSGPT_ZERO_COST_READY: ${{ vars.DSGPT_ZERO_COST_READY }}
        run: |
          test -f reports/android-upgrade.json
          test "$(wc -c < reports/android-upgrade.json)" -lt 8192
          python scripts/ci_artifact_guard.py reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.report.outcome == 'success' && !cancelled()
        with:
          name: android-upgrade-${{ github.sha }}
          path: reports/android-upgrade.json
          retention-days: 1
          if-no-files-found: error
