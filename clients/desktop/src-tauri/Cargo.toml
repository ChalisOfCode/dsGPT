[package]
name = "dsgpt-desktop"
version = "0.10.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

# One codegen unit avoids empty COFF object emission seen with the portable toolchain.
[profile.release.package.dsgpt-desktop]
codegen-units = 1
