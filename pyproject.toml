[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsgpt-backend"
version = "0.9.2"
description = "Local-only dsGPT backend — Stage 3 core integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3", "uvicorn==0.54.0", "httpx==0.28.1", "psutil==7.2.2",
    "vosk==0.3.45", "cffi==2.0.0",
    "onnxruntime==1.31.0", "tokenizers==0.23.3", "numpy==2.5.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0", "ruff==0.17.1", "build==1.6.1"]

[project.scripts]
dsgpt-backend = "dsgpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires a real local inference server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.coverage.run]
source = ["src/dsgpt"]
relative_files = true


[tool.setuptools.package-data]
dsgpt = ["*.java"]
